plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = property('mod_version')
group = 'com.sereneworldgen'

base {
    archivesName = property('mod_id')
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = property('neo_version')

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', property('mod_id')
        }
        server {
            server()
            systemProperty 'neoforge.enabledGameTestNamespaces', property('mod_id')
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', property('mod_id'), '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${property('mod_id')}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
}

dependencies {
    testImplementation sourceSets.main.output
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
}

sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

test {
    useJUnitPlatform()
}

tasks.named('jar', Jar).configure {
    exclude '.cache/**'
}


tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        minecraft_version       : minecraft_version,
        minecraft_version_range : minecraft_version_range,
        neo_version             : neo_version,
        neo_version_range       : neo_version_range,
        mod_id                  : mod_id,
        mod_name                : mod_name,
        mod_license             : mod_license,
        mod_version             : mod_version,
        mod_authors             : mod_authors,
        mod_description         : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}
